<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olala · chat local</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #2f5bd3; --user: #eef2fc; --think: #f3f3ef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #7d9cf0; --user: #242a3a; --think: #262624;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { font-size: 13px; color: var(--muted); }
  #status::before { content: "●"; margin-right: 5px; color: var(--muted); }
  #status.ok::before { color: #2e9e5b; }
  #status.down::before { color: #d0433a; }
  header .spacer { flex: 1; }
  header label { font-size: 13px; color: var(--muted); }
  select, button, textarea {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
  }
  select { padding: 4px 6px; }
  button { padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 20px 0; }
  .msg { max-width: 760px; margin: 0 auto 16px; padding: 0 18px; }
  .msg .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble { background: var(--user); margin-left: 80px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.error .bubble { border: 1px solid #d0433a; color: #d0433a; background: var(--panel); }
  details.think { margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  details.think summary { cursor: pointer; }
  details.think div { white-space: pre-wrap; background: var(--think); padding: 8px 12px; border-radius: 8px; margin-top: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  form { display: flex; gap: 8px; padding: 12px 18px 16px; max-width: 796px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px 12px; min-height: 46px; max-height: 200px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Olala</h1>
  <span id="status">connexion…</span>
  <span class="spacer"></span>
  <label>Raisonnement
    <select id="effort">
      <option value="disabled">désactivé</option>
      <option value="low">faible</option>
      <option value="medium" selected>moyen</option>
      <option value="high">élevé</option>
    </select>
  </label>
  <button id="clear" type="button">Nouvelle conversation</button>
</header>
<main id="log"><p class="empty">Pose une question à Olala (modèle q4e8, en local).</p></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Écris ton message… (Entrée pour envoyer, Maj+Entrée pour un saut de ligne)" autofocus></textarea>
  <button id="send" type="submit">Envoyer</button>
</form>
<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
let history = [];
let controller = null;

async function checkHealth() {
  try {
    const r = await fetch("/api/health");
    const j = await r.json();
    if (r.ok) {
      statusEl.className = "ok";
      statusEl.textContent = "prêt" + (j.context_length ? ` · contexte ${j.context_length}` : "");
    } else throw new Error();
  } catch {
    statusEl.className = "down";
    statusEl.textContent = "serveur Olala arrêté";
  }
}
checkHealth();
setInterval(checkHealth, 10000);

function addMsg(role) {
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = '<div class="bubble"></div>';
  log.appendChild(el);
  return el;
}
const scroll = () => { log.scrollTop = log.scrollHeight; };

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});
document.getElementById("clear").onclick = () => {
  controller?.abort();
  history = [];
  log.innerHTML = '<p class="empty">Nouvelle conversation.</p>';
};

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "auto";
  addMsg("user").querySelector(".bubble").textContent = text;
  history.push({ role: "user", content: text });

  const el = addMsg("assistant");
  const bubble = el.querySelector(".bubble");
  bubble.textContent = "…";
  let think = null, thinkText = "", answer = "", usage = null;
  const t0 = performance.now();
  controller = new AbortController();
  sendBtn.textContent = "Stop";
  scroll();

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: history, stream: true, max_tokens: 4096,
        temperature: 0.8, top_p: 0.9, top_k: 40,
        chat_template_kwargs: { reasoning_effort: document.getElementById("effort").value },
      }),
    });
    if (!r.ok || !r.body) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error?.message || `HTTP ${r.status}`);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const evt = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of evt.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          let j; try { j = JSON.parse(data); } catch { continue; }
          if (j.error) throw new Error(j.error.message);
          if (j.usage) usage = j.usage;
          const d = j.choices?.[0]?.delta;
          if (!d) continue;
          if (d.reasoning_content) {
            if (!think) {
              think = document.createElement("details");
              think.className = "think";
              think.innerHTML = "<summary>Raisonnement</summary><div></div>";
              el.insertBefore(think, bubble);
            }
            thinkText += d.reasoning_content;
            think.querySelector("div").textContent = thinkText;
            if (!answer) bubble.textContent = "réflexion…";
          }
          if (d.content) {
            answer += d.content;
            bubble.textContent = answer;
          }
          scroll();
        }
      }
    }
    if (!answer) bubble.textContent = "(pas de réponse)";
    history.push({ role: "assistant", content: answer });
    const secs = (performance.now() - t0) / 1000;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = usage
      ? `${usage.completion_tokens} tokens · ${secs.toFixed(1)} s · ${(usage.completion_tokens / secs).toFixed(1)} tok/s`
      : `${secs.toFixed(1)} s`;
    el.appendChild(meta);
  } catch (err) {
    if (err.name === "AbortError") {
      if (answer) history.push({ role: "assistant", content: answer });
      else history.pop();
      bubble.textContent = (answer || "") + " [arrêté]";
    } else {
      history.pop();
      el.className = "msg error";
      bubble.textContent = "Erreur : " + err.message;
    }
  } finally {
    controller = null;
    sendBtn.textContent = "Envoyer";
    scroll();
  }
});
</script>
</body>
</html>
